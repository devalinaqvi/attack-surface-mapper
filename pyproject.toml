[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-attack-surface-mapper"
version = "0.1.0"
description = "Evidence-driven dependency capability maps, starting with Composer"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Ali Naqvi"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []

[project.scripts]
dam = "dam.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "jsonschema>=4,<5", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["dam"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.setuptools.data-files]
"share/dam/schemas" = ["schemas/report-1.0.0.schema.json"]
